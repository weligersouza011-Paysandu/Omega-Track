services:
  - type: web
    name: omegatrack-api
    runtime: node
    repo: https://github.com/weligersouza011-Paysandu/Omega-Track
    branch: main
    plan: free
    buildCommand: npm install && npx prisma generate && npm --prefix frontend install && npm --prefix frontend run build && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: API_KEY
        sync: false
      - key: CORS_ORIGIN
        value: '*'
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
    autoDeploy: yes
