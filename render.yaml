services:
  - type: web
    name: omegatrack-api
    runtime: node
    repo: https://github.com/seu-usuario/omegatrack
    branch: main
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: API_KEY
        sync: false
      - key: CORS_ORIGIN
        value: '*'
    autoDeploy: yes
